receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318" # Explicitly bind to all interfaces
      grpc:
        endpoint: "0.0.0.0:4317"

exporters:
  # 1. Define the 'debug' exporter (replaces 'logging' in newer versions)
  debug:
    verbosity: detailed

  # 2. Define the Jaeger exporter
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      # MATCHING NAME: Uses 'debug' defined above
      exporters: [otlp/jaeger, debug]

    logs:
      receivers: [otlp]
      exporters: [debug]

    traces:
      receivers: [otlp]
      # MATCHING NAMES: Uses 'otlp/jaeger' and 'debug' defined above
      exporters: [otlp/jaeger, debug]